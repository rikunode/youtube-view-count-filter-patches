name: Build and release MPP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - uses: android-actions/setup-android@v3
      - name: Install required Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build patch bundle
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon --console plain
      - name: Prepare assets and SHA256SUMS
        run: |
          mkdir -p dist
          cp patches/build/libs/patches-0.1.0.mpp dist/rikunode-view-count-filter-0.1.0.mpp
          cd dist
          sha256sum *.mpp > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: view-count-filter
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rikunode-view-count-filter-0.1.0.mpp
            dist/SHA256SUMS
          generate_release_notes: false
          draft: false
          prerelease: true
    permissions:
      contents: write

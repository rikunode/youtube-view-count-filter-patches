name: Build and release MPP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - name: Install required Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$sdkmanager_bin" --sdk_root="$sdk_root" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build patch bundle
        run: |
          chmod +x ./gradlew
          ./gradlew build :patches:buildAndroid :patches:generatePatchesList --no-daemon --console plain
      - name: Verify Android DEX in distributable MPP
        run: |
          python3 - <<'PY'
          import zipfile
          path = 'patches/build/libs/patches-0.1.7.mpp'
          with zipfile.ZipFile(path) as bundle:
              dex = bundle.getinfo('classes.dex')
              assert dex.file_size > 0, 'classes.dex is empty'
              contents = bundle.read('classes.dex')
              assert b'Lapp/rikunode/morphe/patches/youtube/' in contents, 'YouTube patch class absent from DEX'
              print(f'Android MPP verified: classes.dex={dex.file_size} bytes; own patch namespace found')
          PY
      - name: Prepare assets and SHA256SUMS
        run: |
          mkdir -p dist
          cp patches/build/libs/patches-0.1.7.mpp dist/patches-0.1.7.mpp
          cd dist
          sha256sum *.mpp > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: view-count-filter
          path: dist/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/patches-0.1.7.mpp
            dist/SHA256SUMS
          generate_release_notes: false
          draft: false
          prerelease: true
    permissions:
      contents: write

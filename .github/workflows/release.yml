name: Build and verify MPPs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Publication uses the locally E2E-tested exact MPPs, not a CI rebuild.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
      - name: Install required Android SDK
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$sdkmanager_bin" --sdk_root="$sdk_root" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both isolated bundles
        run: |
          chmod +x ./gradlew
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' gradle.properties | tr -d '\r')"
          test -n "$version"
          mkdir -p dist
          ./gradlew build :patches:buildAndroid :patches:generatePatchesList -PdiagnosticBundle=true --no-daemon --console plain
          cp "patches/build/libs/patches-$version.mpp" "dist/diagnostic-$version.mpp"
          ./gradlew build :patches:buildAndroid :patches:generatePatchesList --no-daemon --console plain
          cp "patches/build/libs/patches-$version.mpp" dist/
      - name: Check isolation
        run: |
          python3 - <<'PY'
          import zipfile, pathlib
          for path in pathlib.Path('dist').glob('*.mpp'):
              with zipfile.ZipFile(path) as z:
                  dex=z.read('classes.dex')
                  ext=z.read('extensions/extension.mpe')
                  diag=path.name.startswith('diagnostic-')
                  assert (b'RelatedItemsProbePatchKt' in dex)==diag, path
                  assert (b'ViewCountM1ProbePatchKt' in dex)!=diag, path
                  if diag:
                      assert b'shouldDrop' not in ext and b'ViewCountFilter;' not in ext, path
                  print(path, 'isolated')
          PY
          cd dist
          sha256sum *.mpp > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: verified-builds-not-release-assets
          path: dist/*
